<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>SemSearch — меню в трее</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}::-webkit-scrollbar-button{display:none;width:0;height:0}::-webkit-scrollbar-thumb{background-color:rgba(128,128,128,.32);border:3.5px solid transparent;border-radius:6px;background-clip:padding-box;min-height:40px}::-webkit-scrollbar-thumb:hover{background-color:rgba(128,128,128,.55);border-width:2px}::-webkit-scrollbar-thumb:active{background-color:rgba(128,128,128,.72);border-width:2px}
a{color:#60b8ff}a:hover{color:#ffffff}
.mi:hover,.ti:hover{background:rgba(255,255,255,.08)}
.tray button{font:inherit;color:inherit;cursor:default}
.tray button:focus-visible,.tray a:focus-visible{outline:2px solid #73a7d8;outline-offset:-2px}
</style>
</helmet>
<div class="tray" lang="{{lang}}" style="position: relative; width: 400px; height: 520px; overflow: hidden; background: #2a3442; color: #f2f2f2; font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif; font-size: 14px; line-height: 1.45">

<div role="menu" aria-label="SemSearch" style="position: absolute; right: 12px; bottom: 60px; width: 292px; box-sizing: border-box; padding: 4px; border: 1px solid #3f3f3f; border-radius: 8px; background: #2c2c2c; box-shadow: 0 8px 24px rgba(0,0,0,.45)">
<div style="display: flex; gap: 10px; padding: 10px 12px 12px; border-bottom: 1px solid #3f3f3f; margin-bottom: 4px">
<span style="flex: none; width: 32px; height: 32px; border-radius: 6px; background: #005fb8; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M28.79 106.54a79.25 79.25 0 1 1 158.5 0a79.25 79.25 0 1 1 -158.5 0ZM59.29 106.54a48.75 48.75 0 1 0 97.5 0a48.75 48.75 0 1 0 -97.5 0Z"></path><path d="M172.71 198.46a27.25 27.25 0 1 1 54.5 0a27.25 27.25 0 1 1 -54.5 0Z"></path></svg></span>
<div style="flex: 1; min-width: 0">
<div style="font-weight: 600">SemSearch</div>
<div style="font-size: 12px; color: #c8c8c8">{{t.status}}</div>
<div role="progressbar" aria-label="{{t.ixLabel}}" aria-valuemin="0" aria-valuemax="612" aria-valuenow="482" style="margin-top: 6px; height: 3px; border-radius: 2px; background: #4a4a4a; overflow: hidden"><div style="width: 79%; height: 100%; background: {{acc}}"></div></div>
</div>
</div>
<button class="mi" role="menuitem" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10.5 4a6.5 6.5 0 1 0 0 13a6.5 6.5 0 0 0 0-13z M15.5 15.5L20 20"></path></svg><span style="flex: 1; font-weight: 600">{{t.open}}</span><span style="font-size: 12px; color: #c8c8c8">Ctrl+Alt+S</span></button>
<button class="mi" role="menuitem" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 5v14 M15 5v14"></path></svg><span style="flex: 1">{{t.pause}}</span></button>
<button class="mi" role="menuitem" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7 M20 4v7h-7"></path></svg><span style="flex: 1">{{t.rescan}}</span></button>
<button class="mi" role="menuitem" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10 M18 7h2 M16 5v4 M4 17h4 M12 17h8 M10 15v4"></path></svg><span style="flex: 1">{{t.settings}}</span></button>
<div role="separator" style="height: 1px; margin: 4px 0; background: #3f3f3f"></div>
<sc-if value="{{update}}" hint-placeholder-val="{{true}}"><a class="mi" role="menuitem" href="Inst-Update.dc.html" style="display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 12px; border-radius: 4px; color: #f2f2f2; text-decoration: none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; color: {{acc}}"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18z M12 16.5v-9 M8 11.5l4-4 4 4"></path></svg><span style="flex: 1">{{t.update}}</span></a></sc-if>
<button class="mi" role="menuitem" style="display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 12px; border: 0; border-radius: 4px; background: transparent; text-align: left"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 3v9 M6.5 6.5a8 8 0 1 0 11 0"></path></svg><span style="flex: 1">{{t.quit}}</span></button>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 2px; padding: 0 8px; background: #1c1c1c; border-top: 1px solid #2f2f2f">
<button class="ti" aria-label="{{t.hidden}}" style="width: 32px; height: 40px; border: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg></button>
<button class="ti" aria-label="SemSearch" style="width: 36px; height: 40px; border: 0; border-radius: 4px; background: rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; position: relative"><svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" style="color: #2b88d8"><path d="M1 6.5a5.5 5.5 0 1 1 11 0a5.5 5.5 0 1 1 -11 0ZM3 6.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0Z"></path><path d="M11 13a2 2 0 1 1 4 0a2 2 0 1 1 -4 0Z"></path></svg><span aria-hidden="true" style="position: absolute; right: 6px; bottom: 9px; width: 6px; height: 6px; border-radius: 3px; background: #f2f2f2; box-shadow: 0 0 0 2px #2e2e2e"></span></button>
<span aria-hidden="true" style="width: 32px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0 M5.5 12.5a9.5 9.5 0 0 1 13 0 M8.5 16a5 5 0 0 1 7 0 M12 19.5h.01"></path></svg></span>
<span aria-hidden="true" style="width: 32px; height: 40px; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z M16.5 8.5a5 5 0 0 1 0 7 M19 6a8.5 8.5 0 0 1 0 12"></path></svg></span>
<span style="display: flex; flex-direction: column; align-items: flex-end; padding: 0 8px 0 6px; font-size: 12px; line-height: 1.3"><span>12:45</span><span>{{t.date}}</span></span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["Русский","English"],"default":"Русский"},"update":{"editor":"boolean","default":true},"accent":{"editor":"color","default":"#005fb8","options":["#005fb8","#0f7b6c","#7a4cc2","#a85200"]},"$preview":{"width":400,"height":520}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#005fb8';
    const light = (hex, t) => {
      if (!/^#[0-9a-f]{6}$/i.test(hex)) return hex;
      const n = parseInt(hex.slice(1), 16);
      const f = c => Math.round(c + (255 - c) * t).toString(16).padStart(2, '0');
      return '#' + f(n >> 16 & 255) + f(n >> 8 & 255) + f(n & 255);
    };
    const en = this.props.lang === 'English';
    const t = en ? { status: 'Indexing videos: 482 of 612', ixLabel: 'Indexing videos', open: 'Open search', pause: 'Pause indexing', rescan: 'Rescan', settings: 'Settings', update: 'Update to 0.5', quit: 'Quit SemSearch', hidden: 'Show hidden icons', date: '10/14/2026' }
      : { status: 'Индексирую видео: 482 из 612', ixLabel: 'Индексация видео', open: 'Открыть поиск', pause: 'Пауза индексации', rescan: 'Пересканировать', settings: 'Настройки', update: 'Обновить до 0.5', quit: 'Выйти из SemSearch', hidden: 'Показать скрытые значки', date: '14.10.2026' };
    return { acc: light(accent, 0.45), t, lang: en ? 'en' : 'ru', update: this.props.update ?? true };
  }
}
</script>
</body>
</html>
