[package]
name = "semsearch-engine"
version = "1.0.0"
edition = "2021"
# rayon 1.12 (Cargo.lock) and <[u8]>::trim_ascii need 1.80
rust-version = "1.80"
description = "SemSearch file-name engine: MFT/USN or walk + ReadDirectoryChangesW index served over a named pipe"
license = "Apache-2.0"
publish = false

[[bin]]
name = "semsearch-engine"
path = "src/main.rs"

[build-dependencies]
# build.rs: version resource (product "SemSearch", version of shell/tauri.conf.json)
embed-resource = "3"
serde_json = "1"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
memchr = "2"
regex = "1"
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
rayon = "1"
ignore = "0.4"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_Com",
    "Win32_System_Diagnostics_Debug",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_UI_Shell",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
