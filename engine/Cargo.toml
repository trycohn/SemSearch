[package]
name = "semsearch-engine"
version = "1.0.0"
edition = "2021"
description = "SemSearch file-name engine: MFT/USN or walk + ReadDirectoryChangesW index served over a named pipe"
publish = false

[[bin]]
name = "semsearch-engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
memchr = "2"
regex = "1"
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
rayon = "1"
ignore = "0.4"

[dependencies.windows-sys]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = false
strip = true
